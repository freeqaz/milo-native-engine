# =============================================================================
# milo-native-engine — Phase 0.4 native CI smoke (convergence gate)
#
# Two jobs:
#   1. engine-skeleton-build : builds the standalone placeholder libmilo-engine.a
#                              (no decomp context). Always runs, very fast,
#                              gates the engine repo's own buildability.
#   2. engine-tests-dc3ref   : configures with cmake/dc3-reference.cmake to pull
#                              in the dc3-decomp sibling, builds milo-engine-tests
#                              (the engine-only convergence test subset — see
#                              rb3/docs/native/NATIVE_PORT_ROADMAP.md §0.2), and
#                              runs ctest. The test target needs the dc3-decomp
#                              checkout (provides core runtime via
#                              tests/dc3_runtime_sources.cmake) AND prebuilt Dawn.
#
# Dawn strategy: download the official Google Dawn release artifact for
# ubuntu-latest from https://github.com/google/dawn/releases. We cache the
# unpacked tree by SHA so re-runs are fast. The release tarball layout
# (lib64/cmake/Dawn/DawnConfig.cmake) matches what dc3-reference.cmake points
# at via CMAKE_PREFIX_PATH, so no rewiring of dc3 CMake is needed.
#
# Assets: the milo-engine-tests suite needs DC3_DATA (game assets, ~18 GB
# uncompressed) for many tests. CI does NOT ship those assets. Affected tests
# GTEST_SKIP() cleanly when DC3_DATA / MILO_LIB are absent, so the suite still
# returns a green pass count for the asset-free tests. The asset-aware milestone
# check is a separate manual/release gate.
# =============================================================================

name: engine-tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: engine-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned via google/dawn release tag. Bump this together with the prebuilt
  # in dc3-decomp-deps/dawn when the engine moves to a newer Dawn ABI.
  DAWN_RELEASE_TAG: v20260423.175430
  DAWN_RELEASE_ASSET: Dawn-31e25af254ab572c77054edec4946d2244e184dd-ubuntu-latest-Release.tar.gz
  DAWN_TREE_NAME: Dawn-31e25af254ab572c77054edec4946d2244e184dd-ubuntu-latest-Release

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — standalone skeleton build (Phase 0.1 acceptance gate)
  # ---------------------------------------------------------------------------
  engine-skeleton-build:
    name: engine skeleton (no decomp context)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout milo-native-engine
        uses: actions/checkout@v4

      - name: Install minimal build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config

      - name: Configure (standalone, placeholder-only)
        run: |
          # MILO_ENGINE_BUILD_TESTS=OFF: the test target needs decomp context;
          # skeleton job only checks the placeholder lib builds.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMILO_ENGINE_BUILD_TESTS=OFF

      - name: Build placeholder libmilo-engine.a
        run: cmake --build build -j"$(nproc)" --verbose

      - name: Verify libmilo-engine.a exists
        run: |
          test -f build/libmilo-engine.a
          ls -la build/libmilo-engine.a
          nm -g build/libmilo-engine.a | head -20 || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## engine skeleton build"
            echo ""
            if [ -f build/libmilo-engine.a ]; then
              echo "- libmilo-engine.a: PASS (\`$(stat -c '%s bytes' build/libmilo-engine.a)\`)"
            else
              echo "- libmilo-engine.a: FAIL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload skeleton build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-skeleton-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/CMakeCache.txt
            build/.ninja_log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2 — convergence test gate against dc3-decomp sibling
  # ---------------------------------------------------------------------------
  engine-tests-dc3ref:
    name: engine tests (dc3 reference context)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout milo-native-engine
        uses: actions/checkout@v4
        with:
          path: milo-native-engine

      - name: Checkout dc3-decomp sibling
        # dc3-decomp is PUBLIC (freeqaz/dc3-decomp). No deploy key needed.
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DC3_DECOMP_REPO || 'freeqaz/dc3-decomp' }}
          ref: ${{ vars.DC3_DECOMP_REF || 'master' }}
          path: dc3-decomp
          # The full repo is large; the engine reference build only needs the
          # working tree of the current ref, not full history.
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavutil-dev \
            libglfw3-dev \
            libgtest-dev \
            libgmock-dev \
            libcurl4-openssl-dev \
            libjpeg-dev \
            libvorbis-dev \
            libogg-dev \
            zlib1g-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev
          clang --version
          cmake --version

      - name: Cache Dawn prebuilt
        id: dawn-cache
        uses: actions/cache@v4
        with:
          path: dc3-decomp-deps/dawn
          key: dawn-${{ env.DAWN_RELEASE_TAG }}-ubuntu-latest

      - name: Download + unpack Dawn prebuilt
        # google/dawn publishes Ubuntu Release tarballs per build. The tree
        # ships lib64/cmake/Dawn/DawnConfig.cmake which is what
        # cmake/dc3-reference.cmake adds to CMAKE_PREFIX_PATH via
        # ../../dc3-decomp-deps/dawn. We mirror that sibling layout so the
        # cmake -C file works unmodified.
        if: steps.dawn-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p dc3-decomp-deps/dawn
          curl -fSL -o /tmp/dawn.tar.gz \
            "https://github.com/google/dawn/releases/download/${DAWN_RELEASE_TAG}/${DAWN_RELEASE_ASSET}"
          mkdir -p /tmp/dawn-unpacked
          tar -xzf /tmp/dawn.tar.gz -C /tmp/dawn-unpacked
          # Move contents up so dc3-decomp-deps/dawn/{lib64,include,...} layout.
          cp -R /tmp/dawn-unpacked/"${DAWN_TREE_NAME}"/. dc3-decomp-deps/dawn/
          ls dc3-decomp-deps/dawn

      - name: Symlink Dawn lib64 -> lib (compat with dc3 sibling layout)
        # cmake/dc3-reference.cmake points at dc3-decomp-deps/dawn/lib/cmake/Dawn;
        # the release tarball puts cmake under lib64. Provide both names so
        # whichever path cmake walks first works.
        run: |
          set -e
          cd dc3-decomp-deps/dawn
          if [ -d lib64 ] && [ ! -e lib ]; then
            ln -s lib64 lib
          fi
          ls -la
          ls lib/cmake/Dawn

      - name: Sanity check — sibling layout
        # cmake/dc3-reference.cmake assumes:
        #   milo-native-engine/cmake/dc3-reference.cmake
        #   dc3-decomp/                     (sibling)
        #   dc3-decomp-deps/dawn/           (sibling)
        run: |
          ls -d milo-native-engine
          ls -d dc3-decomp
          ls -d dc3-decomp-deps/dawn
          ls -d dc3-decomp/src/system/utl || echo "WARN: dc3 utl missing"
          test -f dc3-decomp-deps/dawn/lib/cmake/Dawn/DawnConfig.cmake

      - name: Configure engine + tests (dc3 reference context)
        working-directory: milo-native-engine
        run: |
          cmake -B build-tests -G Ninja \
            -C cmake/dc3-reference.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMILO_ENGINE_BUILD_TESTS=ON

      - name: Build milo-engine + milo-engine-tests
        working-directory: milo-native-engine
        run: |
          # Build the engine first; then the test target if it was configured.
          # tests/CMakeLists.txt returns early (without defining milo-engine-tests)
          # if the dc3 sibling doesn't look like a checkout — guard against that
          # by checking the target list before invoking it.
          cmake --build build-tests --target milo-engine -j"$(nproc)" --verbose
          if cmake --build build-tests --target help 2>/dev/null | grep -q '^\.\.\. milo-engine-tests'; then
            cmake --build build-tests --target milo-engine-tests -j"$(nproc)" --verbose
          else
            echo "::warning::milo-engine-tests target was not configured (dc3 sibling missing or tests/CMakeLists.txt skipped). Skipping ctest."
            echo "SKIP_CTEST=1" >> "$GITHUB_ENV"
          fi

      - name: Run ctest (engine convergence gate)
        if: env.SKIP_CTEST != '1'
        working-directory: milo-native-engine/build-tests
        run: |
          # -j1 mirrors tests/CMakeLists.txt RESOURCE_LOCK; Dawn/WebGPU + audio
          # serialize at the test level (see the comment in tests/CMakeLists.txt
          # for the per-process GPU contention story).
          # Tests that need DC3_DATA assets GTEST_SKIP() cleanly — see
          # tests/CMakeLists.txt comment block for the env-var contract.
          # We don't fail the build on individual test failures because asset-
          # dependent tests will skip; ctest --output-on-failure summarizes.
          ctest -j1 --output-on-failure --no-tests=ignore || echo "CTEST_FAILED=1" >> "$GITHUB_ENV"

      - name: Compute test summary
        if: always() && env.SKIP_CTEST != '1'
        working-directory: milo-native-engine/build-tests
        run: |
          # Parse the LastTest.log for pass/fail/skip counts. ctest's textual
          # output isn't structured; we count by GTest's own output tags.
          # Each milo-engine-tests subprocess prints "[  PASSED  ] N tests."
          LOG="Testing/Temporary/LastTest.log"
          if [ -f "$LOG" ]; then
            PASSED=$(grep -cE '^\[       OK \]' "$LOG" || true)
            FAILED=$(grep -cE '^\[  FAILED  \]' "$LOG" || true)
            SKIPPED=$(grep -cE '^\[  SKIPPED \]' "$LOG" || true)
            DISABLED=$(grep -cE 'DISABLED' "$LOG" || true)
            echo "TEST_PASSED=$PASSED" >> "$GITHUB_ENV"
            echo "TEST_FAILED=$FAILED" >> "$GITHUB_ENV"
            echo "TEST_SKIPPED=$SKIPPED" >> "$GITHUB_ENV"
            echo "TEST_DISABLED=$DISABLED" >> "$GITHUB_ENV"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## milo-engine-tests convergence gate"
            echo ""
            echo "**Reference context:** dc3-decomp sibling (\`${{ vars.DC3_DECOMP_REPO || 'freeqaz/dc3-decomp' }}@${{ vars.DC3_DECOMP_REF || 'master' }}\`)"
            echo "**Dawn:** ${DAWN_RELEASE_TAG}"
            echo ""
            if [ "${SKIP_CTEST:-0}" = "1" ]; then
              echo "ctest was skipped (dc3 sibling not available; placeholder build only)."
            else
              echo "| metric | count |"
              echo "|--------|-------|"
              echo "| GTest cases PASSED   | ${TEST_PASSED:-?} |"
              echo "| GTest cases FAILED   | ${TEST_FAILED:-?} |"
              echo "| GTest cases SKIPPED  | ${TEST_SKIPPED:-?} (typically because DC3_DATA assets are absent in CI) |"
              echo "| GTest cases DISABLED | ${TEST_DISABLED:-?} |"
              echo ""
              if [ "${CTEST_FAILED:-0}" = "1" ]; then
                echo ":warning: ctest reported failures; see logs."
              fi
            fi
            echo ""
            echo "Roadmap reference: \`rb3/docs/native/NATIVE_PORT_ROADMAP.md\` §0.2 (convergence gate) + §0.4 (this CI)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ctest logs on failure
        if: failure() || env.CTEST_FAILED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests-logs
          path: |
            milo-native-engine/build-tests/Testing/Temporary/LastTest.log
            milo-native-engine/build-tests/Testing/Temporary/LastTestsFailed.log
            milo-native-engine/build-tests/CMakeFiles/CMakeOutput.log
            milo-native-engine/build-tests/CMakeFiles/CMakeError.log
            milo-native-engine/build-tests/CMakeCache.txt
            milo-native-engine/build-tests/.ninja_log
          if-no-files-found: ignore
          retention-days: 7
